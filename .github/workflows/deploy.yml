name: Deploy to Windows Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@0.1.7  # TODO: pin to full SHA
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          script: |
            cd /d "%PROJECT_PATH%" || exit /b 1
            git pull --ff-only || exit /b 1
            node --version && call npm --version
            (if not exist logs mkdir logs)
            call npm install --no-audit --no-fund || exit /b 1
            cd backend && call npm install --no-audit --no-fund || exit /b 1
            cd ..\frontend
            (if exist build rmdir /s /q build)
            call npm install --no-audit --no-fund || exit /b 1
            call npm run build || exit /b 1
            dir build\index.html >nul 2>nul || exit /b 1
            cd ..
            (call pm2 restart %PM2_APP_NAME% --update-env || call pm2 start ecosystem.config.js) || exit /b 1
            call pm2 save
            "%SystemRoot%\System32\PING.EXE" -n 16 127.0.0.1 >nul
            "%SystemRoot%\System32\curl.exe" -f -s -o nul http://localhost:5000/ || exit /b 1
            echo SMOKE TEST OK
            echo Deployment completed successfully

      - name: Notify Discord - Success
        if: success()
        uses: Ilshidur/action-discord@0.3.2  # TODO: pin to full SHA
        with:
          args: "✅ Deploy succeeded: ${{ github.repository }}@${{ github.sha }}"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notify Discord - Failure
        if: failure()
        uses: Ilshidur/action-discord@0.3.2  # TODO: pin to full SHA
        with:
          args: "❌ Deploy failed: ${{ github.repository }}@${{ github.sha }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
