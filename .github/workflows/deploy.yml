name: Deploy to Windows Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          script: 'cd /d "${{ secrets.PROJECT_PATH }}" && git pull --ff-only && node --version && call npm --version && (if not exist logs mkdir logs) && call npm install --no-audit --no-fund && cd backend && call npm install --no-audit --no-fund && cd ..\frontend && (if exist build rmdir /s /q build) && call npm install --no-audit --no-fund && call npm run build && dir build\index.html >nul 2>nul && cd .. && (call pm2 restart ${{ secrets.PM2_APP_NAME }} --update-env || call pm2 start ecosystem.config.js) && call pm2 save && "%SystemRoot%\System32\PING.EXE" -n 16 127.0.0.1 >nul && "%SystemRoot%\System32\curl.exe" -f -s -o nul http://localhost:5000/ && echo SMOKE TEST OK && echo Deployment completed successfully'

      - name: Notify Discord - Success
        if: success()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ Deploy succeeded: ${{ github.repository }}@${{ github.sha }}\"}"

      - name: Notify Discord - Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ Deploy failed: ${{ github.repository }}@${{ github.sha }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
